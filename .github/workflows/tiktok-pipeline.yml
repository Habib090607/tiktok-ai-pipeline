name: TikTok AI Content Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TikTok pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
          TIKTOK_INTEGRATION_ID: ${{ secrets.TIKTOK_INTEGRATION_ID }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          python tiktok_pipeline.py \
            --topic "AI trends and tips for 2025" \
            --mode image-text-slides

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ TikTok pipeline failed!"
